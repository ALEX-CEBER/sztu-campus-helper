name: sync-news

# 校园资讯定时同步：抓取校园通 → 生成 data/news.json → 重建 Pages 版 → 自动提交
on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时（UTC）
  workflow_dispatch: {}      # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取校园资讯
        run: python scripts/fetch_news.py

      - name: 重建 Pages 单文件版
        run: python scripts/build_standalone.py --pages

      - name: 有变化则提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news.js docs/index.html
          if git diff --cached --quiet; then
            echo "资讯无变化，跳过提交"
          else
            git commit -m "自动同步：校园资讯 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
