<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="深圳技术大学校园办事问答与校园资讯：办事流程问一句，校园消息顺手看。" />
  <title>SZTU 校园办事万事屋 · 办事问答与校园资讯</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <header class="hero">
    <div class="mascot-wrap">
      <img class="mascot" src="../assets/mascot.png" alt="看板娘 深小技" />
      <span class="mascot-name">深小技</span>
    </div>

    <div class="hero-body">
      <p class="eyebrow">深圳技术大学 · 校园服务</p>
      <h1>校园办事万事屋</h1>
      <p class="slogan">办事流程问一句，校园消息顺手看。</p>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-view="qa" role="tab" aria-selected="true">办事问答</button>
        <button class="tab" data-view="news" role="tab" aria-selected="false">校园资讯</button>
      </nav>

      <div class="view" id="view-qa">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M16.5 16.5 21 21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input id="q" type="text" placeholder="试试：校园卡丢了怎么办 / 图书馆几点开门"
                 autocomplete="off" spellcheck="false" />
          <button id="ask">提问</button>
        </div>
        <div class="chips" id="chips"></div>
        <p class="hero-stats" id="stats">知识库加载中…</p>
      </div>
    </div>

    <aside class="hero-aside" aria-label="今日速览">
      <p class="aside-kicker">今日速览</p>
      <p class="aside-main" id="asideNews">正在同步校园资讯…</p>
      <p class="aside-meta" id="asideMeta">—</p>
      <span class="aside-line"></span>
      <p class="aside-tip">办事流程直接问，答案带来源</p>
    </aside>
  </header>

  <main>
    <section id="results" aria-live="polite"></section>
    <section id="newsPanel" hidden></section>
  </main>

  <footer>
    <p>办事问答按学校公开通知整理，标注 <span class="warn-tag">待核实</span> 的条目以官方通知为准。</p>
    <p>资讯来自 <a href="https://nbw.sztu.edu.cn/" target="_blank" rel="noopener">深圳技术大学校园通</a>，
       仅展示标题与摘要并跳转原文，版权归学校所有。</p>
  </footer>

  <script src="../data/qa.js"></script>
  <script src="../data/news.js"></script>
  <script src="search-core.js"></script>
  <script src="app.js"></script>
  <script src="news.js"></script>
</body>
</html>
