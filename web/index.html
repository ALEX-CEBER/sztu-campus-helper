<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SZTU 校园办事万事屋 · 二次元问答台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="mascot-wrap" id="mascot" title="点我说话～">
        <img class="mascot-img" src="../assets/mascot.png" alt="看板娘 深小技" />
        <span class="eye" id="eyeL" data-eye="l"><span class="pupil"></span></span>
        <span class="eye" id="eyeR" data-eye="r"><span class="pupil"></span></span>
        <span class="bubble" id="bubble"></span>
      </div>
      <h1>校园办事万事屋</h1>
      <p class="sub">深圳技术大学 · 提问即答的办事指南</p>
      <div class="search">
        <input id="q" type="text" placeholder="试试：校园卡丢了怎么办 / 图书馆几点开门" />
        <button id="ask">搜索</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <main>
    <section id="results" aria-live="polite"></section>
  </main>

  <footer>
    <p>数据为通用流程整理，标注 [待核实] 的条目以学校官方通知为准 ·
       <a href="https://github.com/" target="_blank" rel="noopener">课程仓库</a></p>
  </footer>

  <script src="../data/qa.js"></script>
  <script src="search-core.js"></script>
  <script src="mascot.js"></script>
  <script src="app.js"></script>
</body>
</html>
